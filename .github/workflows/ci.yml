name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Same-repo events use Louis's Mac runner (Python and Node checks only); fork pull requests stay
    # on GitHub-hosted Ubuntu. Browser jobs never target the Mac.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","mac-m5"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python style (ruff 0.17.4)
        # Pinned so a Ruff release cannot change CI. Installed in a throwaway venv under RUNNER_TEMP.
        run: |
          python3 -m venv "$RUNNER_TEMP/jaryo-ruff"
          "$RUNNER_TEMP/jaryo-ruff/bin/python" -m pip install --disable-pip-version-check --no-input ruff==0.17.4
          "$RUNNER_TEMP/jaryo-ruff/bin/ruff" check --output-format github .
          "$RUNNER_TEMP/jaryo-ruff/bin/ruff" format --check .
      - name: Install jsdom
        run: npm install --prefix "$RUNNER_TEMP/jaryo-jsdom" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Lab checks
        env:
          JARYO_JSDOM_PATH: ${{ runner.temp }}/jaryo-jsdom/node_modules/jsdom
        run: |
          python3 scripts/validate_lab.py
          python3 scripts/test_validate_catalog_wording.py
          python3 scripts/export_tokens.py --check
          python3 scripts/test_export_tokens.py
          python3 scripts/test_check_suite_token_differential.py
          python3 scripts/check_assets.py
          node --check lab.js
          if [ -f lab-stages.js ]; then node --check lab-stages.js; fi
          node scripts/test_persistence_rules.mjs
          node scripts/test_smoke_cli.mjs
          node scripts/test_static_server.mjs
          node scripts/test_focus_coverage.mjs
          node scripts/test_lab_dom.mjs
          node scripts/test_ci_runners.mjs
          node scripts/test-cli-package.mjs
      - name: Spec checks
        working-directory: spec
        env:
          JSDOM: ${{ runner.temp }}/jaryo-jsdom/node_modules/jsdom
        run: |
          node pipeline/check-tokens.mjs
          node pipeline/check-contrast.mjs
          node tests/check-tokens.test.mjs
          node tests/adaptor.test.mjs
          node tests/decisions.test.mjs reference/index.html
          node tests/render.test.mjs
          node tests/reference-a11y.test.mjs
          node tests/cli.test.mjs
      - name: Spec file hashes
        working-directory: spec
        run: shasum -a 256 -c HASHES.txt

  browsers:
    # Firefox + WebKit on GitHub-hosted Ubuntu 24.04 for every event, like the Chromium jobs.
    # The self-hosted PC runner (pc-win-jaryo) is offline, and a required job that waits on it
    # never starts. Playwright 1.49.1 has Ubuntu 24.04 builds of both engines; --with-deps
    # installs their apt packages. Never run Playwright on the Mac.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Playwright Firefox and WebKit
        # Browser downloads only (apt packages are installed fresh). Keyed by the pinned Playwright version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-1.49.1-firefox-webkit
      - name: Install Playwright Firefox and WebKit
        # Each command gets a per-attempt timeout and up to 3 attempts, so one stalled download or apt
        # mirror does not hold the job until its limit. After a killed attempt, sudo apt-get from
        # --with-deps can outlive timeout and keep /var/lib/dpkg/lock-frontend; wait for those locks
        # (never delete a held lock file) and finish half-installed packages before retrying.
        # Step budget covers 3 timed attempts plus lock waits.
        timeout-minutes: 30
        run: |
          APT_LOCKS="/var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock"

          lock_holders() {
            lock="$1"
            [ -e "$lock" ] || return 0
            if command -v fuser >/dev/null 2>&1; then
              sudo fuser "$lock" 2>/dev/null | tr -cs '0-9' '\n' | grep -E '^[0-9]+$' || true
            elif command -v lsof >/dev/null 2>&1; then
              sudo lsof -t "$lock" 2>/dev/null || true
            fi
          }

          apt_locks_held() {
            for lock in $APT_LOCKS; do
              if [ -n "$(lock_holders "$lock")" ]; then
                return 0
              fi
            done
            return 1
          }

          # Bounded wait for dpkg/apt locks to free. Never deletes lock files.
          wait_for_apt_locks() {
            budget="${1:-180}"
            start="$(date +%s)"
            while apt_locks_held; do
              now="$(date +%s)"
              if [ $((now - start)) -ge "$budget" ]; then
                echo "::warning::apt/dpkg locks still held after ${budget}s"
                return 1
              fi
              sleep 2
            done
            return 0
          }

          # timeout signals its process group, but sudo apt-get often leaves that group.
          stop_stale_apt() {
            saw=0
            for lock in $APT_LOCKS; do
              pids="$(lock_holders "$lock")"
              [ -n "$pids" ] || continue
              saw=1
              echo "::warning::sending TERM to processes holding $lock: $(echo $pids)"
              # shellcheck disable=SC2086
              sudo kill -TERM $pids 2>/dev/null || true
            done
            [ "$saw" -eq 0 ] && return 0
            sleep 3
            for lock in $APT_LOCKS; do
              pids="$(lock_holders "$lock")"
              [ -n "$pids" ] || continue
              echo "::warning::sending KILL to processes still holding $lock: $(echo $pids)"
              # shellcheck disable=SC2086
              sudo kill -KILL $pids 2>/dev/null || true
            done
          }

          retry() {
            limit="$1"; shift
            configured=0
            for attempt in 1 2 3; do
              if [ "$attempt" -gt 1 ]; then
                stop_stale_apt
                wait_for_apt_locks 180 || true
                if [ "$configured" -eq 0 ]; then
                  sudo dpkg --configure -a || echo "::warning::dpkg --configure -a failed; continuing to retry"
                  configured=1
                  wait_for_apt_locks 60 || true
                fi
                sleep $(( (attempt - 1) * 15 ))
              fi
              if timeout --kill-after=10 "$limit" "$@"; then return 0; fi
              echo "::warning::attempt $attempt of 3 failed or timed out: $*"
              stop_stale_apt
            done
            return 1
          }
          tmp="$RUNNER_TEMP/jaryo-pw"
          mkdir -p "$tmp"
          cd "$tmp"
          npm init -y
          retry 180 npm install playwright@1.49.1
          cd -
          ln -sfn "$tmp/node_modules" node_modules
          retry 420 "$tmp/node_modules/.bin/playwright" install --with-deps firefox webkit
      - name: Smoke on Firefox and WebKit
        run: |
          SMOKE_WIDTHS=1280,375,260 node scripts/browser/smoke.mjs "$PWD" /tmp/smoke-firefox.json --browser=firefox
          SMOKE_WIDTHS=1280,375,260 node scripts/browser/smoke.mjs "$PWD" /tmp/smoke-webkit.json --browser=webkit

  forced-colors:
    # Chromium forced-colors checks use GitHub-hosted Ubuntu for all events.
    # Never run Playwright on the Mac. Chromium gets mock-keychain flags in the smoke script.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        if: runner.os != 'Windows'
        run: |
          tmp="$RUNNER_TEMP/jaryo-pw"
          mkdir -p "$tmp"
          cd "$tmp"
          npm init -y
          npm install playwright@1.49.1
          cd -
          ln -sfn "$tmp/node_modules" node_modules
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            "$tmp/node_modules/.bin/playwright" install chromium
          else
            "$tmp/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Forced-colors emulation smoke
        if: runner.os != 'Windows'
        run: node scripts/browser/forced-colors-smoke.mjs "$PWD" /tmp/forced-colors-emulation.json

  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium and axe-core
        run: |
          tmp="$RUNNER_TEMP/jaryo-pw"
          npm install --prefix "$tmp" --ignore-scripts --no-audit --no-fund playwright@1.49.1 axe-core@4.10.3
          ln -sfn "$tmp/node_modules" node_modules
          "$tmp/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chromium smoke and axe
        run: |
          SMOKE_WIDTHS=1280,375,260 node scripts/browser/smoke.mjs "$PWD" "$RUNNER_TEMP/smoke-chromium.json" --browser=chromium
          node scripts/browser/axe-ci.mjs "$PWD" "$RUNNER_TEMP/axe-ci.json"
