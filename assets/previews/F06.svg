<rect x="1214" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="1214" y="246" width="292" height="26" fill="#000"/><text x="1222" y="264" fill="#fff" font-size="12" font-weight="700">F06.10 NESTED BAY</text>
<text x="1224" y="298" font-size="14" fill="#000" xml:space="preserve">+------+</text>
<text x="1224" y="318" font-size="14" fill="#000" xml:space="preserve">|+----+|</text>
<text x="1224" y="338" font-size="14" fill="#000" xml:space="preserve">|+----+|</text>
<text x="1224" y="416" font-size="10" fill="#000">Hierarchy</text>
</svg>