<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="450" viewBox="0 0 1520 450" font-family="Menlo,DejaVu Sans Mono,monospace">
<rect width="1520" height="450" fill="#fff"/>
<rect x="0" y="0" width="1520" height="44" fill="#000"/><text x="12" y="29" fill="#fff" font-size="18" font-weight="700">F04 ACTIONS / SELECTION · 10 OPTIONS · ASCII WIREFRAME PREVIEWS · v0.4</text>
<rect x="14" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="14" y="56" width="292" height="26" fill="#000"/><text x="22" y="74" fill="#fff" font-size="12" font-weight="700">F04.01 STEP FOCUS + NEIGHBOURS</text>
<text x="24" y="108" font-size="14" fill="#000" xml:space="preserve">  [A]---+</text>
<text x="24" y="128" font-size="14" fill="#000" xml:space="preserve">##[ B ]## &lt;- sel</text>
<text x="24" y="148" font-size="14" fill="#000" xml:space="preserve">  [C]&lt;--+ out</text>
<text x="24" y="226" font-size="10" fill="#000">See what a step depends on</text>
<rect x="314" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="314" y="56" width="292" height="26" fill="#000"/><text x="322" y="74" fill="#fff" font-size="12" font-weight="700">F04.02 REVIEW GATE</text>
<text x="324" y="108" font-size="14" fill="#000" xml:space="preserve">RUN DEPLOY?</text>
<text x="324" y="128" font-size="14" fill="#000" xml:space="preserve">diff: 3 files</text>
<text x="324" y="148" font-size="14" fill="#000" xml:space="preserve">[CANCEL][CONFIRM]</text>
<text x="324" y="226" font-size="10" fill="#000">Approve risky steps</text>
<rect x="614" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="614" y="56" width="292" height="26" fill="#000"/><text x="622" y="74" fill="#fff" font-size="12" font-weight="700">F04.03 CAPABILITY-GATED BUTTON</text>
<text x="624" y="108" font-size="14" fill="#000" xml:space="preserve">[RUN]</text>
<text x="624" y="128" font-size="14" fill="#000" xml:space="preserve">[PAUSE] n/a: backend</text>
<text x="624" y="148" font-size="14" fill="#000" xml:space="preserve">  lacks pause</text>
<text x="624" y="226" font-size="10" fill="#000">Know what backend allows</text>
<rect x="914" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="914" y="56" width="292" height="26" fill="#000"/><text x="922" y="74" fill="#fff" font-size="12" font-weight="700">F04.04 SPLIT ACTION</text>
<text x="924" y="108" font-size="14" fill="#000" xml:space="preserve">[RUN] [DRY-RUN] [v]</text>
<text x="924" y="226" font-size="10" fill="#000">Run vs dry-run</text>
<rect x="1214" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="1214" y="56" width="292" height="26" fill="#000"/><text x="1222" y="74" fill="#fff" font-size="12" font-weight="700">F04.05 MULTI-SELECT COMB</text>
<text x="1224" y="108" font-size="14" fill="#000" xml:space="preserve">[x]A [ ]B [x]C</text>
<text x="1224" y="226" font-size="10" fill="#000">Bulk retry</text>
<rect x="14" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="14" y="246" width="292" height="26" fill="#000"/><text x="22" y="264" fill="#fff" font-size="12" font-weight="700">F04.06 HOLD-TO-CONFIRM</text>
<text x="24" y="298" font-size="14" fill="#000" xml:space="preserve">[HOLD ####__]</text>
<text x="24" y="416" font-size="10" fill="#000">Prevent slips</text>
<rect x="314" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="314" y="246" width="292" height="26" fill="#000"/><text x="322" y="264" fill="#fff" font-size="12" font-weight="700">F04.07 INLINE TOGGLE</text>
<text x="324" y="298" font-size="14" fill="#000" xml:space="preserve">[ON|  ] cache-warm</text>
<text x="324" y="318" font-size="14" fill="#000" xml:space="preserve">[OFF] deploy -&gt; review</text>
<text x="324" y="416" font-size="10" fill="#000">Flip a step on/off</text>
<rect x="614" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="614" y="246" width="292" height="26" fill="#000"/><text x="622" y="264" fill="#fff" font-size="12" font-weight="700">F04.08 COMMAND CHIP</text>
<text x="624" y="298" font-size="14" fill="#000" xml:space="preserve">&gt; run parse</text>
<text x="624" y="416" font-size="10" fill="#000">Bridge CLI users</text>
<rect x="914" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="914" y="246" width="292" height="26" fill="#000"/><text x="922" y="264" fill="#fff" font-size="12" font-weight="700">F04.09 DRY-RUN FIRST</text>
<text x="924" y="298" font-size="14" fill="#000" xml:space="preserve">[PREVIEW] then [RUN]</text>
<text x="924" y="416" font-size="10" fill="#000">Safe exploration</text>
<rect x="1214" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="1214" y="246" width="292" height="26" fill="#000"/><text x="1222" y="264" fill="#fff" font-size="12" font-weight="700">F04.10 UNDO LEDGER</text>
<text x="1224" y="298" font-size="14" fill="#000" xml:space="preserve">edit k=3 [UNDO]</text>
<text x="1224" y="416" font-size="10" fill="#000">Recover mistakes</text>
</svg>