<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="450" viewBox="0 0 1520 450" font-family="Menlo,DejaVu Sans Mono,monospace">
<rect width="1520" height="450" fill="#fff"/>
<rect x="0" y="0" width="1520" height="44" fill="#000"/><text x="12" y="29" fill="#fff" font-size="18" font-weight="700">F01 LAYOUT / COMPOSITION · 10 OPTIONS · ASCII WIREFRAME PREVIEWS · v0.4</text>
<rect x="14" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="14" y="56" width="292" height="26" fill="#000"/><text x="22" y="74" fill="#fff" font-size="12" font-weight="700">F01.01 MAIN BUS SPINE</text>
<text x="24" y="108" font-size="14" fill="#000" xml:space="preserve">|=[IN]</text>
<text x="24" y="128" font-size="14" fill="#000" xml:space="preserve">|--[STEP A]</text>
<text x="24" y="148" font-size="14" fill="#000" xml:space="preserve">|--[STEP B]</text>
<text x="24" y="168" font-size="14" fill="#000" xml:space="preserve">|=[OUT]</text>
<text x="24" y="226" font-size="10" fill="#000">See steps &amp; dependencies</text>
<rect x="314" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="314" y="56" width="292" height="26" fill="#000"/><text x="322" y="74" fill="#fff" font-size="12" font-weight="700">F01.02 BAY GRID</text>
<text x="324" y="108" font-size="14" fill="#000" xml:space="preserve">[A][B][C]</text>
<text x="324" y="128" font-size="14" fill="#000" xml:space="preserve">[D][E REVIEW]</text>
<text x="324" y="148" font-size="14" fill="#000" xml:space="preserve">[G][ ][H]</text>
<text x="324" y="226" font-size="10" fill="#000">Scan many steps at once</text>
<rect x="614" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="614" y="56" width="292" height="26" fill="#000"/><text x="622" y="74" fill="#fff" font-size="12" font-weight="700">F01.03 THREE RAIL</text>
<text x="624" y="108" font-size="14" fill="#000" xml:space="preserve">IN | GRAPH | OUT</text>
<text x="624" y="128" font-size="14" fill="#000" xml:space="preserve">-- | -&gt;-&gt;-&gt; | --</text>
<text x="624" y="148" font-size="14" fill="#000" xml:space="preserve">STATUS: RUN OK 3/4</text>
<text x="624" y="226" font-size="10" fill="#000">Configure, run, read in one view</text>
<rect x="914" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="914" y="56" width="292" height="26" fill="#000"/><text x="922" y="74" fill="#fff" font-size="12" font-weight="700">F01.04 ISLAND FIELD</text>
<text x="924" y="108" font-size="14" fill="#000" xml:space="preserve">[ P1 ]    [P2]</text>
<text x="924" y="128" font-size="14" fill="#000" xml:space="preserve"></text>
<text x="924" y="148" font-size="14" fill="#000" xml:space="preserve">   [  P3   ]</text>
<text x="924" y="226" font-size="10" fill="#000">Tell pipelines apart</text>
<rect x="1214" y="56" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="1214" y="56" width="292" height="26" fill="#000"/><text x="1222" y="74" fill="#fff" font-size="12" font-weight="700">F01.05 SWITCHBACK FLOW</text>
<text x="1224" y="108" font-size="14" fill="#000" xml:space="preserve">1&gt;2&gt;3&gt;4-+ (break 4)</text>
<text x="1224" y="128" font-size="14" fill="#000" xml:space="preserve">+-8&lt;7&lt;6&lt;5 (break 8)</text>
<text x="1224" y="148" font-size="14" fill="#000" xml:space="preserve">+&gt;9&gt;10</text>
<text x="1224" y="226" font-size="10" fill="#000">Read long linear flows</text>
<rect x="14" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="14" y="246" width="292" height="26" fill="#000"/><text x="22" y="264" fill="#fff" font-size="12" font-weight="700">F01.06 BROADSHEET</text>
<text x="24" y="298" font-size="14" fill="#000" xml:space="preserve">TEXT TEXT | L1</text>
<text x="24" y="318" font-size="14" fill="#000" xml:space="preserve">TEXT TEXT | L2</text>
<text x="24" y="338" font-size="14" fill="#000" xml:space="preserve">TEXT      | L3</text>
<text x="24" y="416" font-size="10" fill="#000">Explain a run to non-coders</text>
<rect x="314" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="314" y="246" width="292" height="26" fill="#000"/><text x="322" y="264" fill="#fff" font-size="12" font-weight="700">F01.07 FOCUS CROP</text>
<text x="324" y="298" font-size="14" fill="#000" xml:space="preserve">Step 3 of 7: after B, before D</text>
<text x="324" y="318" font-size="14" fill="#000" xml:space="preserve">..|[ STEP C ]|..</text>
<text x="324" y="338" font-size="14" fill="#000" xml:space="preserve">[&lt; PREV B]  [NEXT D &gt;]</text>
<text x="324" y="416" font-size="10" fill="#000">Inspect one step deeply</text>
<rect x="614" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="614" y="246" width="292" height="26" fill="#000"/><text x="622" y="264" fill="#fff" font-size="12" font-weight="700">F01.08 SPLIT PLAN/RUN</text>
<text x="624" y="298" font-size="14" fill="#000" xml:space="preserve">PLAN A&gt;B&gt;C</text>
<text x="624" y="318" font-size="14" fill="#000" xml:space="preserve">----------</text>
<text x="624" y="338" font-size="14" fill="#000" xml:space="preserve">RUN  A ok B ..</text>
<text x="624" y="416" font-size="10" fill="#000">Compare intent vs result</text>
<rect x="914" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="914" y="246" width="292" height="26" fill="#000"/><text x="922" y="264" fill="#fff" font-size="12" font-weight="700">F01.09 RECIRCULATION RING</text>
<text x="924" y="298" font-size="14" fill="#000" xml:space="preserve">+--[RETRY]--+</text>
<text x="924" y="318" font-size="14" fill="#000" xml:space="preserve">|  [CORE]   |</text>
<text x="924" y="338" font-size="14" fill="#000" xml:space="preserve">+---&lt;----+ max 3</text>
<text x="924" y="416" font-size="10" fill="#000">Understand loops &amp; retries</text>
<rect x="1214" y="246" width="292" height="180" fill="#fff" stroke="#000" stroke-width="2"/>
<rect x="1214" y="246" width="292" height="26" fill="#000"/><text x="1222" y="264" fill="#fff" font-size="12" font-weight="700">F01.10 DECK STACK</text>
<text x="1224" y="298" font-size="14" fill="#000" xml:space="preserve">== DECK 2 == in: rows</text>
<text x="1224" y="318" font-size="14" fill="#000" xml:space="preserve">out: a, b (fan-out 2)</text>
<text x="1224" y="338" font-size="14" fill="#000" xml:space="preserve">== DECK 3 ==</text>
<text x="1224" y="416" font-size="10" fill="#000">Map inputs/outputs per stage</text>
</svg>